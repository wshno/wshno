apiVersion: apps/v1
kind: Deployment
metadata:
  name: wshno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wshno
  template:
    metadata:
      labels:
        app: wshno
        app.kubernetes.io/name: wshno
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The distroless `nonroot` base runs the server as UID 65532 and it only reads /public, so
        # runAsNonRoot is all it needs (and what the Kyverno run-as-non-root policy checks).
        runAsNonRoot: true
      containers:
      - name: wshno
        image: ghcr.io/wshno/wshno/web
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
