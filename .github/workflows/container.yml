name: "Publish web container to GHCR"

# Release image: built, scanned, pushed and signed on v* tags (tag-and-release.yml dispatches this
# workflow at the tag ref). Pull requests go through pr-e2e.yml instead.

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  web_container:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: web
      build_context: .
      dockerfile: Dockerfile
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}

  # Renders deploy/ with the image just pushed (tag@digest), and ships it as a signed OCI artifact
  # (ghcr.io/wshno/wshno/manifests:<version>) for Flux in hwinther/proxmox to pull. Release builds
  # only: the tag-and-release workflow dispatches this workflow at the tag ref, so the cosign
  # identity is container.yml@refs/tags/v*, which the OCIRepository verify pins.
  manifests:
    needs: web_container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Signed in this job, so the artifact's cosign identity is container.yml@refs/tags/v*, which
      # the cluster's OCIRepository pins. A single file at the root: the Flux Kustomization applies
      # everything under its path.
      - name: Render, validate, push and sign
        uses: hwinther/reusable-workflows/.github/actions/manifests@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
        with:
          mode: push
          artifact: ghcr.io/wshno/wshno/manifests
          tag: ${{ needs.web_container.outputs.version }}
          images: ghcr.io/wshno/wshno/web:${{ needs.web_container.outputs.version }}@${{ needs.web_container.outputs.image_digest }}
          renders: wshno.yaml=deploy
