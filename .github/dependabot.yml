# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    open-pull-requests-limit: 20
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "hwinther"
    groups:
      reusable-workflows:
        patterns:
          - "hwinther/reusable-workflows*"

  - package-ecosystem: "docker"
    directories:
      - "/"
    open-pull-requests-limit: 20
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "hwinther"
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/e2e"
    open-pull-requests-limit: 20
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "hwinther"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # typescript-eslint, which @wshno/eslint-config builds on, supports TypeScript <6.1. Drop this once a
      # typescript-eslint release widens that range.
      - dependency-name: "typescript"
        versions: [">=6.1"]
    groups:
      # The shared configs peer on eslint and prettier, so they move together. First, because a
      # dependency joins the first group that matches it.
      wshno:
        patterns:
          - "@wshno/*"
          - "eslint"
          - "prettier"
      types:
        patterns:
          - "@types/*"
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      react-router:
        patterns:
          - "react-router"
          - "react-router-*"
          - "@react-router/*"
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      code-quality:
        patterns:
          - "prettier"
          - "@cspell/*"
